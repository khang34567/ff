name: Auto Build APK and EXE

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build RemoteTouch_Android.apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        working-directory: ./RemoteTouch_Android
        run: gradle assembleDebug --no-daemon

      - name: Upload RemoteTouch_Android.apk
        uses: actions/upload-artifact@v4
        with:
          name: RemoteTouch_Android_APK
          path: RemoteTouch_Android/app/build/outputs/apk/debug/RemoteTouch_Android.apk

  build-windows-exe:
    name: Build PC_Controller.exe
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller opencv-python numpy pillow

      - name: Build PC_Controller.exe
        run: |
          pyinstaller --onefile --noconsole --clean --name PC_Controller PC_Controller/PC_Controller.py

      - name: Upload PC_Controller.exe
        uses: actions/upload-artifact@v4
        with:
          name: PC_Controller_EXE
          path: dist/PC_Controller.exe
